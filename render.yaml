services:
  - type: web
    name: rotta
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DB_NAME
        value: rotta
      - key: CENTRAL_DB_NAME
        value: rotta
      - key: COOKIE_SECURE
        value: "true"
