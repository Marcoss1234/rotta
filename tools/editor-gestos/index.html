<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editor de gestos</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0c; color: #f4f4f5; font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #stage canvas { display: block; }
  #panel { width: 340px; overflow-y: auto; background: #16161c; border-left: 1px solid #ffffff1f; padding: 12px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #a1a1aa; margin: 16px 0 6px; }
  p.hint { font-size: 12px; color: #a1a1aa; margin: 0 0 8px; line-height: 1.4; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button, select { min-height: 34px; border-radius: 8px; border: 1px solid #ffffff2e; background: #0a0a0c; color: #f4f4f5; padding: 0 10px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: #ffffff66; }
  button.on { background: #ff3800; border-color: #ff3800; }
  button.primary { background: #ff3800; border-color: #ff3800; font-weight: 700; }
  button.saved::after { content: " ●"; color: #22c55e; }
  button.draft::after { content: " ●"; color: #facc15; }
  label.slider { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0; }
  select { width: 100%; }
  #status { position: absolute; left: 12px; bottom: 12px; background: #000000b3; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  #help { position: absolute; left: 12px; top: 12px; background: #000000b3; padding: 6px 10px; border-radius: 8px; font-size: 12px; color: #d4d4d8; max-width: 420px; }
  @media (max-width: 800px) { #app { flex-direction: column; } #panel { width: 100%; height: 45%; border-left: 0; border-top: 1px solid #ffffff1f; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <p id="help">Toca un punto amarillo (o un botón de la derecha) y muévelo con las barras. Arrastra en el fondo para girar la cámara y usa la rueda para acercar.</p>
    <p id="status">Cargando…</p>
  </div>
  <aside id="panel"></aside>
</div>
<script type="module">
import RefreshRuntime from "/@react-refresh";
RefreshRuntime.injectIntoGlobalHook(window);
window.$RefreshReg$ = () => {};
window.$RefreshSig$ = () => (type) => type;
window.__vite_plugin_react_preamble_installed__ = true;
</script>
<script type="module" src="./editor.js"></script>
</body>
</html>
