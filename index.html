<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/rotta-logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090D18" />
    <script>
      // Antes de pintar nada: el tema, el modo y los colores con los que se vio la app la última vez en este
      // móvil (los guarda src/app/useTheme.js). Así no sale un instante con otros colores al abrirla.
      try {
        var painted = JSON.parse(localStorage.getItem("rotta-pintado") || "null");
        if (painted && painted.vars) {
          var root = document.documentElement;
          root.style.cssText = painted.vars;
          root.dataset.theme = painted.theme;
          root.dataset.rotta = painted.rotta;
          root.dataset.onbrand = painted.onbrand;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", painted.bg);
        }
      } catch (error) {
        // Sin almacenamiento o con datos viejos: la app se pinta igual al arrancar.
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rotta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>Rotta · Gestor de clubs</title>
    <meta
      name="description"
      content="Rotta, el gestor de clubs de voley: plantillas, entrenamientos, partidos, ranking, chat y pizarra 3D en una sola app."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Rotta necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
